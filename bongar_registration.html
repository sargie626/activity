<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign in | Bongar</title>
</head>
<body>
    <main align="center">
        <br><br>
        <table id="login" border="1" cellpadding="20" cellspacing="0" width="500">
            <tr>
                <td>
                    <header>
                        <p align="center">
                            <img src="sunbreathing.jpg" alt="Sun logo" width="180">
                        </p>
                        <p><strong>Sun Son Solar</strong></p>
                        <h1>Good to see you.</h1>
                        <p>Sign in to continue to your account.</p>
                    </header>
                    <hr>
                    <form action="#" method="post">
                        <p><strong>Welcome Back</strong></p>
                        <p>
                            <label for="username">Username or email</label><br>
                            <input id="username" name="username" type="text" autocomplete="username" size="50" required>
                        </p>
                        <p>
                            <label for="password">Password</label><br>
                            <input id="password" name="password" type="password" autocomplete="current-password" size="50" required>
                        </p>
                        <p><a href="#forgot-password">Forgot password?</a></p>
                        <p><button type="submit">Sign in</button></p>
                        <p>Don't have an account? <a href="#sign-up">Sign up</a></p>
                    </form>
                </td>
            </tr>
        </table>
        <br><br>
        <table id="sign-up" border="1" cellpadding="20" cellspacing="0" width="500">
            <tr>
                <td>
                    <header>
                        <p align="center">
                            <img src="sunbreathing.jpg" alt="Sun logo" width="180">
                        </p>
                        <h2>Create an account</h2>
                        <p>Fill in your details to sign up.</p>
                    </header>
                    <hr>
                    <form action="#" method="post">
                        <table width="100%" cellpadding="2" cellspacing="0">
                            <tr>
                                <td align="center">
                                    <label for="first-name">First name</label><br>
                                    <input id="first-name" name="first-name" type="text" autocomplete="given-name" size="20" required>
                                </td>
                                <td align="center">
                                    <label for="last-name">Last name</label><br>
                                    <input id="last-name" name="last-name" type="text" autocomplete="family-name" size="20" required>
                                </td>
                            </tr>
                        </table>
                        <p>
                            <label for="phone">Phone number</label><br>
                            <input id="phone" name="phone" type="tel" autocomplete="tel" size="50" required>
                        </p>
                        <p>
                            <label for="address">Address</label><br>
                            <textarea id="address" name="address" autocomplete="street-address" rows="3" cols="48" required></textarea>
                        </p>
                        <p>
                            <label for="birthday">Birthday</label><br>
                            <input id="birthday" name="birthday" type="date" autocomplete="bday" required>
                        </p>
                        <p>
                            <label for="signup-password">Password</label><br>
                            <input id="signup-password" name="signup-password" type="password" autocomplete="new-password" size="50" required>
                        </p>
                        <p>
                            <label for="confirm-password">Confirm password</label><br>
                            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" size="50" required>
                        </p>
                        <p><button type="submit">Sign up</button></p>
                        <p>Already have an account? <a href="#login">Sign in</a></p>
                    </form>
                </td>
            </tr>
        </table>
    </main>
</body>
</html>
